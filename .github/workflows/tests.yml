name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Check dependencies
        run: python -m pip check
      - name: Run tests (no model server required)
        run: python -m unittest discover -s tests -v
      - name: Verify installed entry point
        run: python -c "from importlib.metadata import distribution; d = distribution('glim'); next(e for e in d.entry_points if e.name == 'glim').load()"
